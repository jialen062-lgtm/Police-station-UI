
name: Build Police station UI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Police-station-UI-1.20.1-Forge-Java17.zip"
          test -s "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Police-station-UI-1.20.1-Forge
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
