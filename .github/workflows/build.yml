
name: Build Police station UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Gradle 8.8
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 4. 查找并解压源码 ZIP
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'Police-station-UI-1.20.1-Forge-Java17*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found source archive: $ZIP_FILE"

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      # 5. 自动寻找 Gradle 项目
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find source -type f \
            -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            find source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found: $PROJECT_DIR"

      # 6. 编译模组
      - name: Build mod
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean build

      # 7. 检查 JAR 文件
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking build output..."

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -print

          JAR_FILE="$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -print -quit)"

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR file generated!"
            exit 1
          fi

          echo "Build successful: $JAR_FILE"

      # 8. 上传编译好的模组
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Police-station-UI-1.20.1-Forge
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
